name: "VBAN Bridge"
version: "0.2.1"
slug: "vban_bridge"
description: >-
  Streams an audio input on the Home Assistant host (for example a turntable
  or tape deck through a USB audio interface) to Music Assistant as a VBAN
  source.
url: "https://github.com/Thrasher2020/vban-bridge"
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
# Gives this add-on Home Assistant's PulseAudio input, including its own
# Audio input selector on the Configuration tab.
audio: true
# The Music Assistant add-on also runs on the host network, so the stream can
# go to 127.0.0.1 and never touch the LAN.
host_network: true
# Needed to read the gate entity and, optionally, stop a Music Assistant
# player when the gate closes. Uses the Supervisor token; no long-lived token.
homeassistant_api: true
options:
  ma_host: "127.0.0.1"
  ma_port: 6980
  stream_name: "VinylBridge"
  sample_rate: 48000
  channels: 2
  format: "16I"
  alsa_device: "pulse"
  buffer_size: 1024
  log_level: 3
  gate_mode: "always"
  gate_entity: ""
  power_threshold_w: 1.0
  off_delay_s: 300
  stop_player: ""
schema:
  ma_host: str
  ma_port: port
  stream_name: match(^[A-Za-z0-9]{1,16}$)
  sample_rate: list(44100|48000)
  channels: list(1|2)
  format: list(16I|24I|32I|32F)
  alsa_device: str
  buffer_size: int(128,8192)
  log_level: int(0,4)
  gate_mode: list(always|switch|power)
  gate_entity: match(^((switch|input_boolean|sensor|binary_sensor)\.[a-z0-9_]+)?$)
  power_threshold_w: float(0,10000)
  off_delay_s: int(0,3600)
  stop_player: match(^(media_player\.[a-z0-9_]+)?$)
